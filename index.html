<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>숲속 꼬마 수학 게임</title>

  <style>
    :root {
      --text: #4e5361;
      --title: #487889;
      --white: rgba(255, 255, 255, 0.88);
      --pink: #ffd9e5;
      --blue: #cfeeff;
      --green: #dff4cf;
      --purple: #eadcff;
      --cream: #fff8e8;
      --brown: #9b6435;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--text);
      background: linear-gradient(
        #c9efff 0%,
        #eafaff 53%,
        #e1f4d7 100%
      );
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px;
    }

    .title {
      margin: 8px 0 18px;
      color: var(--title);
      text-align: center;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -1px;
    }

    .home-screen {
      display: block;
      margin-bottom: 18px;
    }

    .home-card {
      padding: 34px 20px;
      border: 3px solid rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    .home-tree {
      margin-bottom: 7px;
      font-size: 72px;
      line-height: 1;
    }

    .home-card h2 {
      margin: 0;
      color: #547a87;
      font-size: clamp(24px, 4vw, 32px);
    }

    .home-card p {
      margin: 11px 0 0;
      color: #7c8a91;
      font-size: 16px;
      font-weight: bold;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .menu button {
      min-height: 84px;
      border: 3px solid white;
      border-radius: 24px;
      color: #4f5b67;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 4px 0 rgba(90, 120, 130, 0.12);
      transition: transform 0.15s ease;
    }
