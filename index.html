<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숲속 꼬마 수학 게임</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: Arial, "Noto Sans KR", sans-serif;
  color: #4e5361;
  background: linear-gradient(#c9efff, #eafaff 52%, #e1f4d7);
}

button {
  font: inherit;
}

.app {
  width: min(1180px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding: 18px;
}

.title {
  margin: 8px 0 18px;
  color: #487889;
  text-align: center;
  font-size: clamp(28px, 5vw, 42px);
}

.home-card {
  padding: 34px 20px;
  border: 3px solid white;
  border-radius: 30px;
  background: rgba(255, 255, 255, 0.82);
  text-align: center;
}

.home-tree {
  font-size: 70px;
}

.home-card h2 {
  margin: 14px 0 0;
  color: #547a87;
}

.home-card p {
  margin: 12px 0 0;
  font-weight: bold;
}

.menu {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin: 18px 0;
}

.menu button {
  min-height: 84px;
  border: 3px solid white;
  border-radius: 24px;
  cursor: pointer;
  font-size: 17px;
  font-weight: bold;
  box-shadow: 0 4px 0 rgba(80, 120, 130, 0.15);
}

.menu button:nth-child(1) {
  background: #ffd9e5;
}

.menu button:nth-child(2) {
  background: #cfeeff;
}

.menu button:nth-child(3) {
  background: #dff4cf;
}

.menu button:nth-child(4) {
  background: #eadcff;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.panel {
  padding: 22px;
  border: 3px solid white;
  border-radius: 30px;
  background: rgba(255, 255, 255, 0.85);
}

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.game-title {
  margin: 0;
  color: #547a87;
}

.stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.stat {
  min-width: 110px;
  padding: 9px 14px;
  border-radius: 17px;
  text-align: center;
  font-weight: bold;
  background: #fff0b8;
}

.timer {
  background: #ffe0e3;
  color: #c24f56;
}

.score {
  background: #dff3d8;
  color: #4d8a54;
}

.question-card {
  max-width: 740px;
  margin: 24px auto;
  padding: 28px 18px;
  border: 3px dashed #f1c971;
  border-radius: 26px;
  background: #fff8e8;
  text-align: center;
}

.question {
  min-height: 70px;
  display: grid;
  place-items: center;
  color: #615b64;
  font-size: clamp(32px, 7vw, 56px);
  font-weight: 900;
}

.feedback {
  min-height: 28px;
  margin-top: 12px;
  font-weight: bold;
}

.correct {
  color: #55a75d;
}

.wrong {
  color: #e96767;
}

.answer-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  max-width: 650px;
  margin: 20px auto;
}

.answer-btn {
  min-height: 60px;
  border: 3px solid #d7ebed;
  border-radius: 18px;
  background: white;
  color: #60717d;
  cursor: pointer;
  font-size: 24px;
  font-weight: 900;
  box-shadow: 0 4px 0 #c2dfe1;
}

.answer-btn:hover:not(:disabled) {
  background: #f0fbff;
  transform: translateY(-2px);
}

.answer-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.restart-btn,
.back-btn {
  display: block;
  margin: 16px auto 0;
  padding: 12px 22px;
  border: 0;
  border-radius: 18px;
  background: #91cfe0;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.back-btn {
  background: #b8b2d8;
}

/* 도토리 게임 */
.forest-game {
  position: relative;
  min-height: 700px;
  overflow: hidden;
  border-radius: 28px;
  background: linear-gradient(
    #bcecff 0%,
    #eafaff 63%,
    #d8f0c9 63%,
    #d8f0c9 100%
  );
}

.forest-ground {
  position: absolute;
  right: 4%;
  bottom: 110px;
  left: 4%;
  height: 55px;
  border-radius: 50%;
  background: rgba(117, 158, 103, 0.22);
}

.tree {
  position: absolute;
  top: 78px;
  left: 50%;
  width: min(720px, 92%);
  height: 505px;
  transform: translateX(-50%);
}

.tree-crown {
  position: absolute;
  top: 0;
  right: 3%;
  left: 3%;
  height: 310px;
  border: 10px solid #72a84c;
  border-radius: 48% 52% 45% 50%;
  background: #8dc85c;
  box-shadow:
    inset 0 -25px 0 rgba(75, 145, 69, 0.18),
    inset 40px 35px 0 rgba(221, 248, 174, 0.42);
}

.tree-trunk {
  position: absolute;
  bottom: 0;
  left: 34%;
  width: 32%;
  height: 285px;
  border: 8px solid #75451f;
  border-radius: 35px 35px 18px 18px;
  background: #9c6735;
  clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
}

.branch {
  position: absolute;
  z-index: 2;
  height: 18px;
  border-radius: 100%;
  background: #784a26;
  transform-origin: left center;
}

.branch.one {
  top: 165px;
  left: 38%;
  width: 235px;
  transform: rotate(-21deg);
}

.branch.two {
  top: 187px;
  right: 35%;
  width: 220px;
  transform: rotate(22deg);
}

.branch.three {
  top: 245px;
  left: 24%;
  width: 175px;
  transform: rotate(20deg);
}

.branch.four {
  top: 254px;
  right: 24%;
  width: 170px;
  transform: rotate(-24deg);
}

.acorn {
  position: absolute;
  z-index: 5;
  width: 54px;
  height: 62px;
  padding: 0;
  border: 0;
  cursor: pointer;
  background: transparent;
  transform: rotate(var(--rotate));
}

.acorn:hover {
  transform: rotate(var(--rotate)) scale(1.12);
}

.acorn:disabled {
  pointer-events: none;
}

.acorn-cap {
  position: absolute;
  top: 2px;
  left: 5px;
  width: 44px;
  height: 19px;
  border: 3px solid #568c3d;
  border-radius: 50% 50% 35% 35%;
  background: #75a94d;
  pointer-events: none;
}

.acorn-body {
  position: absolute;
  top: 13px;
  left: 4px;
  width: 46px;
  height: 47px;
  display: grid;
  place-items: center;
  border: 4px solid #dc474b;
  border-radius: 50%;
  background: #fffdf1;
  color: #b93436;
  font-size: 22px;
  font-weight: 900;
  pointer-events: none;
}

.acorn.selected {
  filter: drop-shadow(0 0 8px #ffd45c);
  transform: rotate(var(--rotate)) scale(1.2);
}

.acorn.collected {
  opacity: 0;
  transform: translate(190px, 360px) scale(0.3);
}

.squirrel {
  position: absolute;
  z-index: 10;
  bottom: 86px;
