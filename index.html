<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수학 게임 선택</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(#c9efff, #e1f4d7);
    }

    .app {
      width: min(1000px, 100%);
      margin: 0 auto;
      padding: 30px 18px;
      text-align: center;
    }

    h1 {
      color: #487889;
    }

    .home {
      padding: 30px 18px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.8);
    }

    .tree {
      font-size: 70px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    button {
      min-height: 80px;
      border: 3px solid white;
      border-radius: 22px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:nth-child(1) {
      background: #ffd9e5;
    }

    button:nth-child(2) {
      background: #cfeeff;
    }

    button:nth-child(3) {
      background: #dff4cf;
    }

    button:nth-child(4) {
      background: #eadcff;
    }

    @media (max-width: 700px) {
      .menu {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>숲속 꼬마 수학 게임</h1>

    <section class="home">
      <div class="tree">🌳</div>
      <h2>어떤 게임을 해 볼까요?</h2>
      <p>재미있는 수학 게임을 골라 보세요.</p>
    </section>

    <div class="menu">
      <button type="button">세 수의 덧셈</button>
      <button type="button">세 수의 뺄셈</button>
      <button type="button">도토리 10 만들기</button>
      <button type="button">두 사람 대결</button>
    </div>
  </main>
</body>
</html>
